services:
  - type: web
    name: tiphouse-backend
    runtime: docker
    plan: free
    dockerContext: .
    dockerfilePath: ./apps/backend/Dockerfile
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: FRONTEND_URL
        sync: false
      - key: DATABASE_URL
        sync: false
      - key: REDIS_URL
        sync: false
      - key: JWT_ACCESS_SECRET
        sync: false
      - key: JWT_REFRESH_SECRET
        sync: false
      - key: OMISE_PUBLIC_KEY
        sync: false
      - key: OMISE_SECRET_KEY
        sync: false
      - key: OMISE_WEBHOOK_SECRET
        sync: false
      - key: GBPRIMEPAY_MERCHANT_ID
        sync: false
      - key: GBPRIMEPAY_SECRET
        sync: false
      - key: STREAMLABS_CLIENT_ID
        sync: false
      - key: STREAMLABS_CLIENT_SECRET
        sync: false
      - key: STREAMLABS_REDIRECT_URI
        sync: false

  - type: web
    name: tiphouse-frontend
    runtime: docker
    plan: free
    dockerContext: .
    dockerfilePath: ./apps/frontend/Dockerfile
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 3000
      - key: NEXT_PUBLIC_API_URL
        value: https://tiphouse-backend.onrender.com/api
      - key: NEXT_PUBLIC_SOCKET_URL
        value: https://tiphouse-backend.onrender.com
      - key: NEXT_PUBLIC_FRONTEND_URL
        value: https://tiphouse-frontend.onrender.com
