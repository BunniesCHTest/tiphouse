services:
  - type: web
    name: tiphouse-backend
    runtime: node
    plan: free
    buildCommand: npm install --include=dev --workspaces && cd apps/backend && ../../node_modules/.bin/prisma generate && cd ../.. && npm run build -w packages/types && cd apps/backend && ../../node_modules/.bin/nest build
    startCommand: cd apps/backend && ../../node_modules/.bin/prisma migrate deploy && node dist/src/main.js
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: 22
      - key: FRONTEND_URL
        sync: false
      - key: DATABASE_URL
        sync: false
      - key: REDIS_URL
        sync: false
      - key: JWT_ACCESS_SECRET
        sync: false
      - key: JWT_REFRESH_SECRET
        sync: false
      - key: OMISE_PUBLIC_KEY
        sync: false
      - key: OMISE_SECRET_KEY
        sync: false
      - key: OMISE_WEBHOOK_SECRET
        sync: false
      - key: GBPRIMEPAY_MERCHANT_ID
        sync: false
      - key: GBPRIMEPAY_SECRET
        sync: false
      - key: STREAMLABS_CLIENT_ID
        sync: false
      - key: STREAMLABS_CLIENT_SECRET
        sync: false
      - key: STREAMLABS_REDIRECT_URI
        sync: false

  - type: web
    name: tiphouse-frontend
    runtime: node
    plan: free
    buildCommand: npm install --include=dev --workspaces && npm run build -w packages/types && cd apps/frontend && ./node_modules/.bin/next build
    startCommand: cd apps/frontend && ./node_modules/.bin/next start -p $PORT
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: 22
      - key: NEXT_PUBLIC_API_URL
        sync: false
      - key: NEXT_PUBLIC_SOCKET_URL
        sync: false
      - key: NEXT_PUBLIC_FRONTEND_URL
        sync: false
